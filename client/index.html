<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Notification Relay</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:   #ffffff;
      --off:     #f5f5f5;
      --border:  #d4d4d4;
      --border2: #e5e5e5;
      --text:    #111111;
      --muted:   #6b6b6b;
      --faint:   #999999;
      --black:   #111111;
      --radius:  4px;
      --font:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono:    'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    .shell { max-width: 1100px; margin: 0 auto; padding: 40px 24px 60px; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 28px;
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--black);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--faint);
      margin-top: 3px;
      font-weight: 400;
    }

    /* ── Summary bar ─────────────────────────────────────────────────────── */
    .summary-bar {
      display: flex;
      gap: 0;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
      background: var(--off);
    }

    .summary-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-right: 1px solid var(--border);
      min-width: 80px;
    }

    .summary-item:last-child { border-right: none; }

    .summary-num {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: var(--black);
      line-height: 1.1;
    }

    .summary-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
      margin-top: 3px;
    }

    .summary-divider {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    button {
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius);
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      transition: background 0.1s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: var(--off); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-solid {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .btn-solid:hover:not(:disabled) { background: #333; }

    .btn-xs { padding: 3px 8px; font-size: 11px; }

    /* ── Section label ───────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      margin-bottom: 8px;
    }

    /* ── Inline form ─────────────────────────────────────────────────────── */
    .form-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      background: var(--off);
      margin-bottom: 16px;
    }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }

    .field-label { font-size: 11px; font-weight: 500; color: var(--muted); }

    input, textarea {
      font-family: var(--font);
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 9px;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus { border-color: var(--black); }
    textarea { resize: vertical; min-height: 56px; }

    /* ── Badges ──────────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* Claim status — all monochrome */
    .bs-open     { background: var(--off);  border: 1px solid var(--border); color: var(--muted); }
    .bs-approved { background: #111; color: #fff; border: 1px solid #111; }
    .bs-rejected { background: var(--white); border: 1px solid #111; color: #111; }

    /* Notification status */
    .ns-sent     { background: #111; color: #fff; border: 1px solid #111; }
    .ns-retrying { background: var(--off); border: 1px solid var(--border); color: var(--muted); font-style: italic; }
    .ns-failed   { background: var(--white); border: 1px solid #111; color: #111; }
    .ns-pending  { background: var(--off); border: 1px solid var(--border2); color: var(--faint); }

    /* ── Claims table ────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      border-bottom: 1px solid var(--border);
      background: var(--off);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border2);
      cursor: pointer;
      transition: background 0.08s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--off); }
    tbody tr.row-active { background: var(--off); outline: 1px solid var(--border); outline-offset: -1px; }

    td { padding: 10px 12px; vertical-align: middle; }

    .td-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    .td-policy {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--black);
      font-weight: 500;
    }

    .td-desc {
      color: var(--muted);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .td-notifs { display: flex; gap: 5px; flex-wrap: wrap; }

    .td-date { color: var(--faint); font-size: 11px; white-space: nowrap; }

    /* ── Detail panel ────────────────────────────────────────────────────── */
    .detail {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      margin-bottom: 16px;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border2);
      gap: 12px;
    }

    .detail-policy {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 2px;
    }

    .detail-desc { font-size: 12px; color: var(--muted); max-width: 500px; }

    .detail-body { padding: 14px 16px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .status-row-label { font-size: 11px; color: var(--faint); font-weight: 500; }

    .status-btns { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Timeline ────────────────────────────────────────────────────────── */
    .tl-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      border-top: 1px solid var(--border2);
      padding-top: 12px;
      margin-bottom: 12px;
    }

    .tl { list-style: none; }

    .tl-item {
      position: relative;
      padding: 0 0 14px 22px;
    }

    .tl-item::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 14px;
      bottom: 0;
      width: 1px;
      background: var(--border2);
    }

    .tl-item:last-child::before { display: none; }

    .tl-dot {
      position: absolute;
      left: 1px;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 2px solid var(--white);
      box-shadow: 0 0 0 1px var(--border);
    }

    .dot-sent    { background: var(--black); box-shadow: 0 0 0 1px var(--black); }
    .dot-retrying{ background: var(--faint); box-shadow: 0 0 0 1px var(--faint); }
    .dot-failed  { background: var(--white); box-shadow: 0 0 0 1.5px var(--black); }

    .tl-head {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .tl-channel {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--black);
    }

    .tl-meta { font-size: 11px; color: var(--faint); }

    .tl-attempts {
      font-size: 10px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .tl-detail {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--off);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 7px 9px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 5px;
    }

    /* ── Empty / loading ─────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 36px;
      color: var(--faint);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast-wrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 9000;
    }

    .toast {
      background: var(--black);
      color: var(--white);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 12px;
      min-width: 220px;
      max-width: 320px;
      animation: tIn 0.18s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    .toast-error { background: var(--white); color: var(--black); border: 1px solid var(--black); }

    @keyframes tIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Misc ────────────────────────────────────────────────────────────── */
    .flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ml-auto { margin-left: auto; }
    .mono { font-family: var(--mono); font-size: 11px; }
    hr.sep { border: none; border-top: 1px solid var(--border2); margin: 12px 0; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;
const API = '';

// ── Utilities ─────────────────────────────────────────────────────────────────

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s.replace(' ', 'T') + 'Z').toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

function claimBadgeClass(s) {
  return { Open: 'bs-open', Approved: 'bs-approved', Rejected: 'bs-rejected' }[s] || 'bs-open';
}

function notifBadgeClass(s) {
  return { Sent: 'ns-sent', Retrying: 'ns-retrying', Failed: 'ns-failed' }[s] || 'ns-pending';
}

function dotClass(s) {
  return { Sent: 'dot-sent', Retrying: 'dot-retrying', Failed: 'dot-failed' }[s] || 'dot-retrying';
}

// ── Toast ──────────────────────────────────────────────────────────────────────

function ToastContainer({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast${t.type === 'error' ? ' toast-error' : ''}`}>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = 'info') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3200);
  }, []);
  return { toasts, push };
}

// ── Summary Bar ────────────────────────────────────────────────────────────────

function SummaryBar({ claims }) {
  let totalClaims = claims.length;
  let sent = 0, retrying = 0, failed = 0, pending = 0;

  for (const c of claims) {
    const ns = c.notification_status || {};
    for (const ch of ['crm', 'notify']) {
      const s = ns[ch]?.status;
      if (s === 'Sent')     sent++;
      else if (s === 'Retrying') retrying++;
      else if (s === 'Failed')   failed++;
      else                        pending++;
    }
  }

  const items = [
    { label: 'Claims',   num: totalClaims },
    { label: 'Sent',     num: sent        },
    { label: 'Retrying', num: retrying    },
    { label: 'Failed',   num: failed      },
    { label: 'Pending',  num: pending     },
  ];

  return (
    <div className="summary-bar">
      {items.map((it, i) => (
        <div className="summary-item" key={it.label}>
          <div className="summary-num">{it.num}</div>
          <div className="summary-label">{it.label}</div>
        </div>
      ))}
    </div>
  );
}

// ── Status Badge ──────────────────────────────────────────────────────────────

function ClaimBadge({ status }) {
  return <span className={`badge ${claimBadgeClass(status)}`}>{status}</span>;
}

function NotifBadge({ channel, status, attempts }) {
  const label = status || 'Pending';
  return (
    <span
      className={`badge ${notifBadgeClass(status)}`}
      title={`${channel}: ${label} (${attempts || 0} attempt${attempts !== 1 ? 's' : ''})`}
    >
      {channel.toUpperCase()} {label}
    </span>
  );
}

// ── New Claim Form ─────────────────────────────────────────────────────────────

function NewClaimForm({ onCreated, push }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ policy_number: '', description: '' });
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!form.policy_number.trim() || !form.description.trim()) {
      return push('Both fields are required.', 'error');
    }
    setSaving(true);
    try {
      const res  = await fetch(`${API}/api/claims`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      push(`Claim ${data.policy_number} created.`);
      setForm({ policy_number: '', description: '' });
      setOpen(false);
      onCreated();
    } catch (err) { push(err.message, 'error'); }
    finally { setSaving(false); }
  };

  if (!open) {
    return (
      <button className="btn-solid" onClick={() => setOpen(true)} style={{ marginBottom: 16 }}>
        + New Claim
      </button>
    );
  }

  return (
    <div className="form-card">
      <div className="flex" style={{ marginBottom: 12 }}>
        <span style={{ fontWeight: 600, fontSize: 13 }}>New Claim</span>
        <button className="ml-auto btn-xs" onClick={() => setOpen(false)}>Cancel</button>
      </div>
      <form onSubmit={submit}>
        <div className="form-row">
          <div className="field">
            <label className="field-label">Policy Number</label>
            <input
              placeholder="e.g. POL-2024-009"
              value={form.policy_number}
              onChange={e => setForm(f => ({ ...f, policy_number: e.target.value }))}
            />
          </div>
          <div className="field" style={{ flex: 2 }}>
            <label className="field-label">Description</label>
            <input
              placeholder="Describe the claim event"
              value={form.description}
              onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
            />
          </div>
        </div>
        <button type="submit" className="btn-solid" disabled={saving}>
          {saving ? <><span className="spinner" />Creating…</> : 'Create Claim'}
        </button>
      </form>
    </div>
  );
}

// ── Notification Timeline ──────────────────────────────────────────────────────

function NotifTimeline({ claimId, push, onRefreshClaims }) {
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [replaying, setReplaying] = useState({});
  const timerRef = useRef(null);

  const load = useCallback(async () => {
    try {
      const r = await fetch(`${API}/api/claims/${claimId}/notifications`);
      const j = await r.json();
      setData(j);
    } catch (_) {}
    setLoading(false);
  }, [claimId]);

  useEffect(() => {
    load();
    timerRef.current = setInterval(load, 2000);
    return () => clearInterval(timerRef.current);
  }, [load]);

  const replay = async (channel) => {
    setReplaying(r => ({ ...r, [channel]: true }));
    try {
      const res = await fetch(`${API}/api/claims/${claimId}/notifications/${channel}/replay`, { method: 'POST' });
      const j   = await res.json();
      if (!res.ok) throw new Error(j.error || 'Replay failed');
      push(`Replaying ${channel} channel…`);
      onRefreshClaims();
    } catch (err) { push(err.message, 'error'); }
    finally { setReplaying(r => ({ ...r, [channel]: false })); }
  };

  if (loading) return <div style={{ color: 'var(--faint)', fontSize: 12 }}><span className="spinner" />Loading…</div>;
  if (!data)   return null;

  const { notifications } = data;

  return (
    <div>
      <div className="tl-section-label">
        Notification History
        {notifications.length > 0 && <span style={{ fontWeight: 400, marginLeft: 6 }}>· {notifications.length} record{notifications.length !== 1 ? 's' : ''} · auto-refreshing</span>}
      </div>

      {notifications.length === 0 && (
        <p style={{ color: 'var(--faint)', fontSize: 12 }}>
          No attempts yet. Change the claim's status above to trigger the relay.
        </p>
      )}

      <ul className="tl">
        {notifications.map(n => (
          <li key={n.id} className="tl-item">
            <span className={`tl-dot ${dotClass(n.status)}`} />
            <div className="tl-head">
              <span className="tl-channel">{n.channel}</span>
              <span className={`badge ${notifBadgeClass(n.status)}`} style={{ fontSize: 10 }}>{n.status}</span>
              <span className="tl-attempts">{n.attempt_count}×</span>
              <span className="tl-meta">{fmtDate(n.last_attempt_at)}</span>
              {n.status === 'Failed' && (
                <button
                  className="btn-xs btn-solid"
                  disabled={replaying[n.channel]}
                  onClick={() => replay(n.channel)}
                  style={{ marginLeft: 'auto' }}
                >
                  {replaying[n.channel] ? <><span className="spinner" />Replaying…</> : '↺ Replay'}
                </button>
              )}
            </div>
            {n.response_detail && (
              <div className="tl-detail">
                {(() => { try { return JSON.stringify(JSON.parse(n.response_detail), null, 2); } catch { return n.response_detail; } })()}
              </div>
            )}
          </li>
        ))}
      </ul>
    </div>
  );
}

// ── Detail Panel ───────────────────────────────────────────────────────────────

function DetailPanel({ claim, onClose, onRefresh, push }) {
  const [busy, setBusy] = useState(false);
  const STATUSES = ['Open', 'Approved', 'Rejected'];

  const changeStatus = async (s) => {
    if (s === claim.status) return;
    setBusy(true);
    try {
      const res  = await fetch(`${API}/api/claims/${claim.id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: s }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      push(`Status → ${s} · Notifications firing…`);
      onRefresh();
    } catch (err) { push(err.message, 'error'); }
    finally { setBusy(false); }
  };

  return (
    <div className="detail">
      <div className="detail-head">
        <div>
          <div className="detail-policy">{claim.policy_number}</div>
          <div className="detail-desc">{claim.description}</div>
        </div>
        <button className="btn-xs" onClick={onClose}>✕ Close</button>
      </div>
      <div className="detail-body">
        <div className="status-row">
          <span className="status-row-label">Status</span>
          <ClaimBadge status={claim.status} />
          <span style={{ color: 'var(--faint)', fontSize: 11 }}>Created {fmtDate(claim.created_at)}</span>
        </div>
        <div className="status-row" style={{ marginBottom: 14 }}>
          <span className="status-row-label">Change to</span>
          <div className="status-btns">
            {STATUSES.map(s => (
              <button
                key={s}
                disabled={busy || s === claim.status}
                onClick={() => changeStatus(s)}
                className={s === claim.status ? 'btn-solid' : ''}
              >
                {s}
              </button>
            ))}
            {busy && <span className="spinner" />}
          </div>
        </div>
        <NotifTimeline claimId={claim.id} push={push} onRefreshClaims={onRefresh} />
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────

function App() {
  const [claims, setClaims]     = useState([]);
  const [loading, setLoading]   = useState(true);
  const [selectedId, setSelected] = useState(null);
  const { toasts, push } = useToast();

  const load = useCallback(async () => {
    try {
      const r = await fetch(`${API}/api/claims`);
      const d = await r.json();
      setClaims(d);
    } catch (e) { push('Failed to load claims.', 'error'); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 3000);
    return () => clearInterval(id);
  }, [load]);

  const selected = claims.find(c => c.id === selectedId);

  return (
    <div className="shell">
      {/* Header */}
      <div className="header">
        <div className="header-row">
          <div>
            <div className="brand">Claim Notification Relay</div>
            <div className="brand-sub">Modeled on Guidewire's App Events pattern · Portfolio project · Not Guidewire software</div>
          </div>
          <button onClick={load} style={{ fontSize: 11 }}>⟳ Refresh</button>
        </div>
      </div>

      {/* Summary */}
      <SummaryBar claims={claims} />

      {/* New Claim */}
      <NewClaimForm onCreated={load} push={push} />

      {/* Detail */}
      {selected && (
        <DetailPanel
          claim={selected}
          onClose={() => setSelected(null)}
          onRefresh={load}
          push={push}
        />
      )}

      {/* Table */}
      <div className="section-label">All Claims</div>

      {loading && <div className="empty"><span className="spinner" />Loading claims…</div>}

      {!loading && claims.length === 0 && (
        <div className="empty">
          No claims. Create one above or run <span className="mono">npm run seed</span> for demo data.
        </div>
      )}

      {!loading && claims.length > 0 && (
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Policy</th>
                <th>Description</th>
                <th>Status</th>
                <th>CRM</th>
                <th>Notify</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              {claims.map(c => {
                const crm    = c.notification_status?.crm;
                const notify = c.notification_status?.notify;
                return (
                  <tr
                    key={c.id}
                    className={c.id === selectedId ? 'row-active' : ''}
                    onClick={() => setSelected(c.id === selectedId ? null : c.id)}
                  >
                    <td className="td-id">{c.id}</td>
                    <td className="td-policy">{c.policy_number}</td>
                    <td className="td-desc" title={c.description}>{c.description}</td>
                    <td><ClaimBadge status={c.status} /></td>
                    <td>
                      {crm
                        ? <NotifBadge channel="crm"    status={crm.status}    attempts={crm.attempt_count}    />
                        : <span className="badge ns-pending">CRM Pending</span>
                      }
                    </td>
                    <td>
                      {notify
                        ? <NotifBadge channel="notify" status={notify.status} attempts={notify.attempt_count} />
                        : <span className="badge ns-pending">NOTIFY Pending</span>
                      }
                    </td>
                    <td className="td-date">{fmtDate(c.created_at)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <ToastContainer toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
